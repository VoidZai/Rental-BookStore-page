<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <title>Rental Bookstore</title>
</head>
<body>
  <header class="navbar">
    <div class="container">
      <h1 class="logo">Rental Bookstore</h1>
      <nav>
        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Categories</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="wrapper container">
    <section class="featured-book">
      <h2 class="section-heading">Popular Book</h2>
      <div class="book-card">
        <div class="book-image">
          <img src="https://d1tgh8fmlzexmh.cloudfront.net/ccbp-static-website/book-apj-img.png" alt="Wings of Fire book cover" />
        </div>
        <div class="book-details">
          <h3>Wings of Fire</h3>
          <h4>An Autobiography of Abdul Kalam</h4>
          <p>by Arun Tiwari</p>
          <a class="btn" href="abcd1.html">Read Now</a>
        </div>
      </div>
    </section>

    <section class="recommended-books">
      <h2 class="section-heading">Recommended Books</h2>

      <div class="book-card">
        <div class="book-image">
          <img src="https://d1tgh8fmlzexmh.cloudfront.net/ccbp-static-website/book-chetan-bhagat-img.png" alt="The 3 Mistakes of My Life book cover" />
        </div>
        <div class="book-details">
          <h3>The 3 Mistakes of My Life</h3>
          <p>Indian author<br />by Chetan Bhagat</p>
          <a class="btn" href="abcd2.html">Read Now</a>
        </div>
      </div>

      <div class="book-card">
        <div class="book-image">
          <img src="https://d1tgh8fmlzexmh.cloudfront.net/ccbp-static-website/harrypotter-img.png" alt="Harry Potter book cover" />
        </div>
        <div class="book-details">
          <h3>Harry Potter</h3>
          <p>and the Sorcerer's Stone<br />by J.K. Rowling</p>
          <a class="btn" href="abcd3.html">Read Now</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
